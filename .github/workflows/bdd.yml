name: BDD tests
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: bdd-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          ENV: qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes
          path: reports